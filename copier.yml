# Copier template for R&D projects built on nuikit and the nuinashco conventions.
#
#   uvx copier copy --trust gh:nuinashco/rnd-template my-project
#   uvx copier update --trust                  # inside a generated project
#
# The project's files live in template/. `--trust` lets the migrations below run.

_min_copier_version: "9.4.0"
_subdirectory: template
_templates_suffix: .jinja
_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

_migrations:
  # 1.0.0 depends on nuikit and the conventions plugin instead of copying them in.
  - version: "1.0.0"
    command:
      - "{{ _copier_python }}"
      - -c
      - >-
        import pathlib, shutil;
        paths = ['src/nuikit', 'tests/nuikit', 'CONVENTIONS.md',
        '.claude/agents/conventions-reviewer.md', '.claude/agents/descriptions-judge.md'];
        [shutil.rmtree(p) if p.is_dir() else p.unlink()
        for p in map(pathlib.Path, paths) if p.exists()]

project_name:
  type: str
  help: Distribution name (kebab-case, e.g. llm-eval-launcher)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    use lowercase letters, digits and dashes, starting with a letter
    {% endif %}

package:
  type: str
  help: Import name of the package
  default: "{{ project_name | replace('-', '_') }}"
  validator: >-
    {% if not (package | regex_search('^[a-z][a-z0-9_]*$')) %}
    use a lowercase Python identifier
    {% endif %}

description:
  type: str
  help: One-line description
  default: "{{ project_name }}"

author_name:
  type: str
  help: Author name
  default: Ivan Havlytskyi

author_email:
  type: str
  help: Author email
  default: ivan.havlytskyi@gmail.com

python:
  type: str
  help: Minimum Python version (latest stable unless a dependency needs older)
  default: "3.14"
  validator: >-
    {% if not (python | regex_search('^3[.]1[2-9]$')) %}
    use 3.12 or newer, e.g. 3.14
    {% endif %}

use_wandb:
  type: bool
  help: Mirror runs to Weights & Biases (opt-in per run with `tracker=wandb`)?
  default: false

example:
  type: bool
  help: Include the worked example domain (delete it once your first real family exists)?
  # Only projects made before 1.0.0 carry a `profile` answer, so updating one leaves the example out.
  default: "{{ profile is not defined }}"

# Where the two dependencies come from: TOML inline tables for [tool.uv.sources].
# Never asked; the template's tests pass `{ path = "..." }` to test local checkouts.
nuikit_source:
  type: str
  default: '{ git = "https://github.com/nuinashco/nuikit", tag = "v0.1.0" }'
  when: false

hooks_source:
  type: str
  default: '{ git = "https://github.com/nuinashco/conventions", tag = "v0.1.0" }'
  when: false

# Derived names, never asked.
cli:
  type: str
  default: "{{ package | replace('_', '-') }}"
  when: false

legacy_python:
  type: bool
  default: "{{ python.split('.')[1] | int < 14 }}"
  when: false
