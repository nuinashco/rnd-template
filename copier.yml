# Copier template for R&D projects built on nuikit and the nuinashco conventions.
#
#   uvx copier copy gh:nuinashco/rnd-template my-project
#   uvx copier update --trust                  # inside a generated project
#
# The project's files live in template/. `--trust` lets the migrations below run. A project made
# before 1.0.0 first sets `_src_path: gh:nuinashco/rnd-template` in its .copier-answers.yml, which
# still names nuinashco/conventions (README.md, "Update a project").

_min_copier_version: "9.4.0"
_subdirectory: template
_templates_suffix: .jinja
_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

_migrations:
  # 1.0.0 holds the rnd project only, and depends on nuikit and the conventions plugin instead of
  # copying them in. Before anything changes, the first command stops in a uni or lab project and
  # says in the others what goes: copier deletes the copies, local edits included. The second
  # clears what copier left of them.
  - version: "1.0.0"
    when: "{{ _stage == 'before' }}"
    command:
      - "{{ _copier_python }}"
      - -c
      - |
        import sys, yaml
        with open("{{ _copier_conf.answers_file }}", encoding="utf-8") as answers:
            profile = yaml.safe_load(answers).get("profile", "rnd")
        if profile != "rnd":
            sys.exit(f"error: rnd-template 1.0.0 has no {profile} profile, so this project stays "
                     "on the release it was made from; nothing was changed")
        print("1.0.0 removes src/nuikit, tests/nuikit, CONVENTIONS.md and the two subagents in "
              ".claude/agents, local edits included: nuikit and the plugins bring them now. "
              "`git checkout HEAD -- <path>` brings one back before you commit.")
  - version: "1.0.0"
    command:
      - "{{ _copier_python }}"
      - -c
      - >-
        import pathlib, shutil;
        paths = ['src/nuikit', 'tests/nuikit', 'CONVENTIONS.md',
        '.claude/agents/conventions-reviewer.md', '.claude/agents/descriptions-judge.md'];
        [shutil.rmtree(p) if p.is_dir() else p.unlink()
        for p in map(pathlib.Path, paths) if p.exists()]

project_name:
  type: str
  help: Distribution name (kebab-case, e.g. llm-eval-launcher)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    use lowercase letters, digits and dashes, starting with a letter
    {% endif %}

package:
  type: str
  help: Import name of the package
  default: "{{ project_name | replace('-', '_') }}"
  validator: >-
    {% if not (package | regex_search('^[a-z][a-z0-9_]*$')) %}
    use a lowercase Python identifier
    {% endif %}

description:
  type: str
  help: One-line description
  default: "{{ project_name }}"

author_name:
  type: str
  help: Author name
  default: Ivan Havlytskyi

author_email:
  type: str
  help: Author email
  default: ivan.havlytskyi@gmail.com

python:
  type: str
  help: Minimum Python version (latest stable unless a dependency needs older)
  default: "3.14"
  validator: >-
    {% if not (python | regex_search('^3[.]1[2-9]$')) %}
    use 3.12 or newer, e.g. 3.14
    {% endif %}

use_wandb:
  type: bool
  help: Mirror runs to Weights & Biases (opt-in per run with `tracker=wandb`)?
  default: false

example:
  type: bool
  help: Include the worked example domain (delete it once your first real family exists)?
  # Only projects made before 1.0.0 carry a `profile` answer, so updating one leaves the example out.
  default: "{{ profile is not defined }}"

# Where the two dependencies come from: TOML inline tables for [tool.uv.sources].
# Never asked; the template's tests pass `{ path = "..." }` to test local checkouts.
nuikit_source:
  type: str
  default: '{ git = "https://github.com/nuinashco/nuikit", tag = "v0.1.0" }'
  when: false

hooks_source:
  type: str
  default: '{ git = "https://github.com/nuinashco/conventions", tag = "v0.1.0" }'
  when: false

# Derived names, never asked.
cli:
  type: str
  default: "{{ package | replace('_', '-') }}"
  when: false

legacy_python:
  type: bool
  default: "{{ python.split('.')[1] | int < 14 }}"
  when: false
