# Copier template for R&D projects built on nuikit and the nuinashco conventions.
#
#   uvx copier copy gh:nuinashco/rnd-template my-project
#   uvx copier update                          # inside a generated project
#
# The project's files live in template/. An update that runs one of the migrations below needs
# `--trust`. A project made before 1.0.0 first sets `_src_path: gh:nuinashco/rnd-template` in its
# .copier-answers.yml, which still names nuinashco/conventions (README.md, "Update a project").

# 9.4.0 and 9.6.0 cannot read _copier_conf in a default, which `project_name` does.
_min_copier_version: "9.7.0"
_subdirectory: template
_templates_suffix: .jinja
_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

_migrations:
  # 1.0.0 holds the rnd project only, and depends on nuikit and the conventions plugin instead of
  # copying them in. Before anything changes, the first command stops in a uni or lab project and
  # says in the others what goes: copier deletes the copies, local edits included. The second
  # clears what copier left of them.
  - version: "1.0.0"
    when: "{{ _stage == 'before' }}"
    command:
      - "{{ _copier_python }}"
      - "{{ _copier_conf.src_path }}/migrations/to_1_0_0.py"
      - before
      - "{{ _copier_conf.answers_file }}"
  - version: "1.0.0"
    command:
      - "{{ _copier_python }}"
      - "{{ _copier_conf.src_path }}/migrations/to_1_0_0.py"
      - after

project_name:
  type: str
  help: Distribution name, kebab-case (e.g. llm-eval-launcher)
  default: "{{ _copier_conf.dst_path | realpath | basename }}"
  # Copier cuts a message off at the terminal's width, after its own 46 characters.
  validator: >-
    {% if not (project_name | regex_search('^[a-z]([a-z0-9-]*[a-z0-9])?$')) %}
    use kebab-case, like my-project
    {% endif %}

package:
  type: str
  help: Import name of the package
  default: "{{ project_name | replace('-', '_') }}"
  # 27 characters keep every generated line within 88 columns. A keyword cannot be imported, the
  # modules listed are ones Python or a dependency already has, and LAY-2 refuses the last six.
  validator: >-
    {% if not (package | regex_search('^[a-z][a-z0-9_]*$')) %}
    use snake_case, like my_project
    {% elif package | length > 27 %}
    use at most 27 characters
    {% elif package in ('and as assert async await break class continue def del elif else except
    finally for from global if import in is lambda nonlocal not or pass raise return try while
    with yield').split() %}
    a Python keyword; pick another name
    {% elif package in ('abc array ast calendar code copy csv email enum glob html http io json
    logging math numbers os parser platform profile queue random re resource secrets select
    signal site statistics string struct sys test tests time token trace types typing uuid xml
    attr attrs click hydra nuikit numpy omegaconf pydantic pytest rootutils structlog wandb
    yaml').split() %}
    hides a module of that name; pick another
    {% elif package in ('common core helpers misc util utils').split() %}
    too vague (LAY-2); name what it does
    {% endif %}

description:
  type: str
  help: One-line description
  default: "{{ project_name }}"

author_name:
  type: str
  help: Author name
  default: Ivan Havlytskyi

author_email:
  type: str
  help: Author email
  default: ivan.havlytskyi@gmail.com

python:
  type: str
  help: Minimum Python version (latest stable unless a dependency needs older)
  default: "3.14"
  validator: >-
    {% if not (python | regex_search('^3[.]1[2-9]$')) %}
    use 3.12 or newer, e.g. 3.14
    {% endif %}

use_wandb:
  type: bool
  help: Mirror runs to Weights & Biases (opt-in per run with `tracker=wandb`)?
  default: false

example:
  type: bool
  help: Include the worked example (delete it once a real family exists)?
  # Only projects made before 1.0.0 carry a `profile` answer, so updating one leaves the example out.
  default: "{{ profile is not defined }}"

# Where the two dependencies come from: TOML inline tables for [tool.uv.sources].
# Never asked; the template's tests pass `{ path = "..." }` to test local checkouts.
nuikit_source:
  type: str
  default: '{ git = "https://github.com/nuinashco/nuikit", tag = "v0.1.0" }'
  when: false

hooks_source:
  type: str
  default: '{ git = "https://github.com/nuinashco/conventions", tag = "v0.1.0" }'
  when: false

# Derived names, never asked.
cli:
  type: str
  default: "{{ package | replace('_', '-') }}"
  when: false

legacy_python:
  type: bool
  default: "{{ python.split('.')[1] | int < 14 }}"
  when: false
