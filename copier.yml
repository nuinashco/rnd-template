# Copier template for R&D projects built on nuikit and the nuinashco conventions.
#
#   uvx copier copy gh:nuinashco/rnd-template my-project
#   uvx copier update                          # inside a generated project
#
# The project's files live in template/. An update that runs one of the migrations below needs
# `--trust`. A project made before 1.0.0 first replaces nuinashco/conventions with
# nuinashco/rnd-template in two lines: `_src_path` in its .copier-answers.yml and
# `conventions-hooks` in its pyproject.toml (UPGRADING.md).

# The name questions leave a default out with UNSET, which older releases cannot read.
_min_copier_version: "9.11.0"
_subdirectory: template
_templates_suffix: .jinja
_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

_migrations:
  # 1.0.0 holds the rnd project only, and depends on nuikit and the conventions plugin instead of
  # copying them in. Before anything changes, the first command stops in a uni or lab project and
  # says in the others what goes: copier deletes the copies, local edits included. The second
  # clears what copier left of them, except files git ignores.
  - version: "1.0.0"
    when: "{{ _stage == 'before' }}"
    command:
      - "{{ _copier_python }}"
      - "{{ _copier_conf.src_path }}/migrations/to_1_0_0.py"
      - before
      - "{{ _copier_conf.answers_file }}"
      - "{{ _version_from }}"
  - version: "1.0.0"
    command:
      - "{{ _copier_python }}"
      - "{{ _copier_conf.src_path }}/migrations/to_1_0_0.py"
      - after
      - "{{ _copier_conf.answers_file }}"
      - "{{ _version_from }}"

project_name:
  type: str
  help: Distribution name, kebab-case (e.g. llm-eval-launcher)
  # The folder's name, made kebab-case. Copier checks a default before it asks, so a name it would
  # refuse is offered only under --defaults, where the refusal is the answer.
  default: >-
    {% from 'includes/names.jinja' import project_refusal %}{% set name = _copier_conf.dst_path
    | realpath | basename | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') %}{{
    name if _copier_conf.defaults or not project_refusal(name) | trim else UNSET }}
  validator: >-
    {% from 'includes/names.jinja' import project_refusal %}{{
    project_refusal(project_name, _copier_conf.overwrite) }}

package:
  type: str
  help: Import name of the package
  default: >-
    {% from 'includes/names.jinja' import package_refusal %}{% set name = project_name
    | replace('-', '_') %}{{
    name if _copier_conf.defaults or not package_refusal(name) | trim else UNSET }}
  # An update runs with `overwrite` on, a first copy without: that is how the two macros tell
  # a project that exists, which keeps any name an earlier release took, from a new one.
  validator: >-
    {% from 'includes/names.jinja' import package_refusal %}{{
    package_refusal(package, _copier_conf.overwrite) }}

description:
  type: str
  help: One-line description
  default: "{{ project_name }}"

author_name:
  type: str
  help: Author name
  default: Ivan Havlytskyi

author_email:
  type: str
  help: Author email
  default: ivan.havlytskyi@gmail.com

python:
  type: str
  help: Minimum Python version (latest stable unless a dependency needs older)
  default: "3.14"
  validator: >-
    {% if not (python | regex_search('^3[.]1[2-9]$')) %}
    use 3.12 or newer, e.g. 3.14
    {% endif %}

use_wandb:
  type: bool
  help: Mirror runs to Weights & Biases (opt-in per run with `tracker=wandb`)?
  default: false

example:
  type: bool
  help: Include the worked example (delete it once a real family exists)?
  # Only projects made before 1.0.0 carry a `profile` answer, so updating one leaves the example out.
  default: "{{ profile is not defined }}"

# Where the two dependencies come from: TOML inline tables for [tool.uv.sources].
# Never asked; the template's tests pass `{ path = "..." }` to test local checkouts.
nuikit_source:
  type: str
  default: '{ git = "https://github.com/nuinashco/nuikit", tag = "v0.1.0" }'
  when: false

hooks_source:
  type: str
  default: '{ git = "https://github.com/nuinashco/conventions", tag = "v0.1.0" }'
  when: false

# Derived names, never asked.
cli:
  type: str
  default: "{{ package | replace('_', '-') }}"
  when: false

legacy_python:
  type: bool
  default: "{{ python.split('.')[1] | int < 14 }}"
  when: false
