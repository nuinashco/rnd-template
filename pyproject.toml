[project]
name = "rnd-template"
version = "0"  # Never built: the template's versions are its git tags.
description = "Copier template for R&D projects built on nuikit and the nuinashco conventions"
requires-python = ">=3.12"

[dependency-groups]
dev = ["copier>=9.19", "pytest>=9.1", "pyyaml>=6", "ruff>=0.17"]

[tool.uv]
package = false

[tool.conventions]  # Opts in to the conventions checks (TOOL-4); `make lint` runs them.

[tool.ruff]
line-length = 88
extend-exclude = ["template"]  # Jinja sources; the test checks their renders.

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RET", "PTH", "C4", "C90", "RUF", "TID",
    "FBT", "N", "PERF", "G", "LOG", "BLE", "PL", "D", "NPY", "ERA", "T20",
    "TD004", "TD005", "TD006", "TD007", "FA",
    "D401",  # The google convention drops imperative mood; selecting it restores it.
]
ignore = [
    "PLC0415", "PLR2004", "PLR0913",
    "D102", "D103", "D105", "D106", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]  # Runs on Python 3.12.

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "use an in-process fake instead (TST-3)"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
