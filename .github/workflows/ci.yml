name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The update tests start a project from the v0.3.4 release.
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      # No NUIKIT_PATH or CONVENTIONS_PATH: rendered projects install the releases copier.yml pins,
      # which is what a user gets.
      - run: make lint test
